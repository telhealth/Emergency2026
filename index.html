<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚨 비상대응 유형 테스트 | FAB 안전 MBTI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&display=swap');

:root {
–bg: #FFF8F0;
–card: #FFFFFF;
–primary: #FF6B35;
–primary-light: #FF8C5A;
–secondary: #2D4A7A;
–accent: #FFD166;
–accent2: #06D6A0;
–text: #1A1A2E;
–text-light: #5A5A7A;
–danger: #EF233C;
–shadow: 0 8px 32px rgba(255,107,53,0.15);
–radius: 20px;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: ‘Gowun Dodum’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
overflow-x: hidden;
}

/* Floating background shapes */
body::before {
content: ‘’;
position: fixed;
top: -100px; right: -100px;
width: 400px; height: 400px;
background: radial-gradient(circle, rgba(255,209,102,0.25) 0%, transparent 70%);
border-radius: 50%;
pointer-events: none;
z-index: 0;
}
body::after {
content: ‘’;
position: fixed;
bottom: -80px; left: -80px;
width: 350px; height: 350px;
background: radial-gradient(circle, rgba(6,214,160,0.18) 0%, transparent 70%);
border-radius: 50%;
pointer-events: none;
z-index: 0;
}

.container {
max-width: 680px;
margin: 0 auto;
padding: 20px 16px 60px;
position: relative;
z-index: 1;
}

/* HEADER */
.header {
text-align: center;
padding: 40px 0 20px;
animation: fadeDown 0.7s ease;
}
.header .badge {
display: inline-block;
background: var(–primary);
color: white;
font-family: ‘Black Han Sans’, sans-serif;
font-size: 12px;
letter-spacing: 2px;
padding: 6px 16px;
border-radius: 99px;
margin-bottom: 16px;
}
.header h1 {
font-family: ‘Black Han Sans’, sans-serif;
font-size: clamp(28px, 6vw, 42px);
color: var(–secondary);
line-height: 1.2;
margin-bottom: 10px;
}
.header h1 span { color: var(–primary); }
.header .subtitle {
font-size: 14px;
color: var(–text-light);
line-height: 1.7;
}
.emoji-row {
font-size: 32px;
letter-spacing: 8px;
margin: 16px 0;
animation: bounce 2s infinite;
}

/* PROGRESS BAR */
.progress-wrap {
margin: 24px 0 16px;
display: none;
}
.progress-wrap.visible { display: block; }
.progress-label {
display: flex;
justify-content: space-between;
font-size: 13px;
color: var(–text-light);
margin-bottom: 8px;
}
.progress-bar {
height: 8px;
background: #E8E0D8;
border-radius: 99px;
overflow: hidden;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, var(–primary), var(–accent));
border-radius: 99px;
transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

/* CARD */
.card {
background: var(–card);
border-radius: var(–radius);
padding: 32px 28px;
box-shadow: var(–shadow);
border: 2px solid rgba(255,107,53,0.08);
animation: slideUp 0.5s ease;
position: relative;
overflow: hidden;
}
.card::before {
content: ‘’;
position: absolute;
top: 0; left: 0; right: 0;
height: 4px;
background: linear-gradient(90deg, var(–primary), var(–accent), var(–accent2));
}

/* SCENARIO TAG */
.scenario-tag {
display: inline-flex;
align-items: center;
gap: 6px;
background: rgba(255,107,53,0.1);
color: var(–primary);
font-size: 12px;
font-weight: 700;
padding: 5px 12px;
border-radius: 99px;
margin-bottom: 16px;
}

/* QUESTION */
.question-num {
font-family: ‘Black Han Sans’, sans-serif;
font-size: 48px;
color: rgba(255,107,53,0.12);
line-height: 1;
position: absolute;
top: 20px; right: 24px;
}
.question-movie {
background: linear-gradient(135deg, var(–secondary), #1a2f5a);
color: var(–accent);
border-radius: 12px;
padding: 14px 18px;
font-size: 14px;
font-style: italic;
margin-bottom: 20px;
position: relative;
}
.question-movie::before {
content: ‘🎬’;
margin-right: 8px;
}
.question-text {
font-size: clamp(16px, 3.5vw, 19px);
font-weight: 700;
line-height: 1.6;
color: var(–text);
margin-bottom: 24px;
}

/* OPTIONS */
.options { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
background: #FAFAF8;
border: 2.5px solid #EDE8E0;
border-radius: 14px;
padding: 16px 20px;
text-align: left;
cursor: pointer;
font-family: ‘Gowun Dodum’, sans-serif;
font-size: 15px;
color: var(–text);
transition: all 0.2s ease;
display: flex;
align-items: flex-start;
gap: 12px;
}
.option-btn:hover {
border-color: var(–primary);
background: rgba(255,107,53,0.05);
transform: translateX(4px);
}
.option-btn.selected {
border-color: var(–primary);
background: rgba(255,107,53,0.08);
}
.option-emoji {
font-size: 20px;
flex-shrink: 0;
margin-top: 1px;
}

/* START CARD */
.start-card { text-align: center; }
.start-card .big-emoji {
font-size: 72px;
display: block;
margin: 8px 0 24px;
animation: pulse 2s infinite;
}
.start-card h2 {
font-family: ‘Black Han Sans’, sans-serif;
font-size: 22px;
color: var(–secondary);
margin-bottom: 12px;
}
.start-card p {
font-size: 14px;
color: var(–text-light);
line-height: 1.8;
margin-bottom: 28px;
}
.tags {
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
margin-bottom: 28px;
}
.tag {
background: rgba(45,74,122,0.08);
color: var(–secondary);
font-size: 12px;
padding: 5px 12px;
border-radius: 99px;
}

/* BUTTONS */
.btn-primary {
display: block;
width: 100%;
background: linear-gradient(135deg, var(–primary), var(–primary-light));
color: white;
border: none;
border-radius: 14px;
padding: 18px;
font-family: ‘Black Han Sans’, sans-serif;
font-size: 18px;
cursor: pointer;
box-shadow: 0 6px 20px rgba(255,107,53,0.4);
transition: all 0.2s ease;
letter-spacing: 1px;
}
.btn-primary:hover {
transform: translateY(-2px);
box-shadow: 0 10px 28px rgba(255,107,53,0.45);
}
.btn-primary:active { transform: translateY(0); }

.btn-next {
margin-top: 20px;
display: none;
width: 100%;
background: var(–secondary);
color: white;
border: none;
border-radius: 14px;
padding: 16px;
font-family: ‘Black Han Sans’, sans-serif;
font-size: 16px;
cursor: pointer;
transition: all 0.2s;
letter-spacing: 1px;
}
.btn-next.visible { display: block; }
.btn-next:hover { background: #1a2f5a; transform: translateY(-1px); }

.btn-restart {
background: none;
border: 2.5px solid var(–secondary);
color: var(–secondary);
border-radius: 14px;
padding: 14px;
font-family: ‘Black Han Sans’, sans-serif;
font-size: 15px;
cursor: pointer;
transition: all 0.2s;
margin-top: 12px;
width: 100%;
}
.btn-restart:hover { background: var(–secondary); color: white; }

/* RESULT */
.result-card { text-align: center; }
.result-type-badge {
display: inline-block;
background: linear-gradient(135deg, var(–primary), var(–accent));
color: white;
font-family: ‘Black Han Sans’, sans-serif;
font-size: 13px;
padding: 8px 20px;
border-radius: 99px;
margin-bottom: 16px;
letter-spacing: 2px;
}
.result-emoji { font-size: 80px; display: block; margin: 8px 0; }
.result-title {
font-family: ‘Black Han Sans’, sans-serif;
font-size: clamp(22px, 5vw, 30px);
color: var(–secondary);
margin-bottom: 8px;
line-height: 1.3;
}
.result-subtitle {
font-size: 14px;
color: var(–primary);
font-weight: 700;
margin-bottom: 20px;
}
.result-desc {
background: #FAFAF8;
border-radius: 14px;
padding: 20px;
font-size: 14px;
line-height: 1.8;
color: var(–text);
text-align: left;
margin-bottom: 20px;
border-left: 4px solid var(–primary);
}

/* SAFETY INFO BOX */
.safety-box {
background: linear-gradient(135deg, #1A1A2E, #2D4A7A);
border-radius: 16px;
padding: 24px;
text-align: left;
margin-bottom: 20px;
color: white;
}
.safety-box h3 {
font-family: ‘Black Han Sans’, sans-serif;
font-size: 16px;
color: var(–accent);
margin-bottom: 14px;
display: flex;
align-items: center;
gap: 8px;
}
.safety-item {
display: flex;
gap: 10px;
align-items: flex-start;
margin-bottom: 10px;
font-size: 13px;
line-height: 1.6;
}
.safety-item .dot {
width: 6px; height: 6px;
background: var(–accent);
border-radius: 50%;
margin-top: 7px;
flex-shrink: 0;
}

.tip-tag {
display: inline-block;
background: rgba(6,214,160,0.15);
color: var(–accent2);
font-size: 12px;
font-weight: 700;
padding: 4px 10px;
border-radius: 99px;
margin-bottom: 8px;
}

/* SCORE BAR */
.score-row {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 8px;
font-size: 13px;
}
.score-label { width: 80px; color: var(–text-light); flex-shrink: 0; }
.score-bar-wrap { flex: 1; height: 8px; background: #EDE8E0; border-radius: 99px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 99px; transition: width 1s ease 0.3s; }

/* SHARE */
.share-row {
display: flex;
gap: 10px;
margin-top: 8px;
}
.share-btn {
flex: 1;
background: #EDE8E0;
border: none;
border-radius: 12px;
padding: 14px;
font-family: ‘Gowun Dodum’, sans-serif;
font-size: 13px;
color: var(–text);
cursor: pointer;
transition: all 0.2s;
}
.share-btn:hover { background: #E0D8CE; }

/* ANIMATIONS */
@keyframes fadeDown {
from { opacity: 0; transform: translateY(-20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(24px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
0%,100% { transform: translateY(0); }
50% { transform: translateY(-8px); }
}
@keyframes pulse {
0%,100% { transform: scale(1); }
50% { transform: scale(1.08); }
}
@keyframes confetti {
0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
.confetti-piece {
position: fixed;
width: 10px; height: 10px;
border-radius: 2px;
animation: confetti 2.5s ease forwards;
pointer-events: none;
z-index: 999;
}

.hidden { display: none !important; }

footer {
text-align: center;
padding: 24px 0 8px;
font-size: 12px;
color: #BBB;
}
</style>

</head>

let currentQ = 0;
let scores = { A: 0, B: 0, C: 0, D: 0 };
let selectedAnswer = null;

function startQuiz() {
document.getElementById('startScreen').style.display = 'none';
document.getElementById('progressWrap').classList.add('visible');
showQuestion();
}

function showQuestion() {
const q = questions[currentQ];
document.getElementById('questionScreen').style.display = 'block';
document.getElementById('resultScreen').style.display = 'none';

document.getElementById('scenarioTag').textContent = q.scenario;
document.getElementById('questionNum').textContent = String(currentQ + 1).padStart(2, '0');
document.getElementById('movieQuote').textContent = q.movie;
document.getElementById('questionText').textContent = q.question;

const container = document.getElementById('optionsContainer');
container.innerHTML = '';
q.options.forEach((opt, i) => {
const btn = document.createElement('button');
btn.className = 'option-btn';
btn.innerHTML = `<span class="option-emoji">${opt.emoji}</span><span>${opt.text}</span>`;
btn.onclick = () => selectOption(i, btn);
container.appendChild(btn);
});

document.getElementById('nextBtn').classList.remove('visible');
selectedAnswer = null;

// Progress
const pct = Math.round((currentQ / questions.length) * 100);
document.getElementById('progressText').textContent = `${currentQ + 1} / ${questions.length}`;
document.getElementById('progressPct').textContent = pct + '%';
document.getElementById('progressFill').style.width = pct + '%';

// Animate
const qs = document.getElementById('questionScreen');
qs.style.animation = 'none';
void qs.offsetWidth;
qs.style.animation = 'slideUp 0.4s ease';
}

function selectOption(idx, btn) {
document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
btn.classList.add('selected');
selectedAnswer = idx;
document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
if (selectedAnswer === null) return;
const q = questions[currentQ];
const scoreObj = q.options[selectedAnswer].score;
Object.keys(scoreObj).forEach(k => scores[k] += scoreObj[k]);

currentQ++;
if (currentQ < questions.length) {
showQuestion();
} else {
showResult();
}
}

function showResult() {
document.getElementById('questionScreen').style.display = 'none';
document.getElementById('progressWrap').classList.remove('visible');

// Find winner
let maxScore = -1, winner = 'A';
Object.keys(scores).forEach(k => {
if (scores[k] > maxScore) { maxScore = scores[k]; winner = k; }
});

const r = results[winner];
const rs = document.getElementById('resultScreen');
rs.style.display = 'block';

const barRows = Object.keys(r.bars).map((label, i) => `
<div class="score-row">
<span class="score-label">${label}</span>
<div class="score-bar-wrap">
<div class="score-bar-fill" style="width:0%;background:${r.barColors[i]}" data-target="${r.bars[label]}"></div>
</div>
<span style="font-size:12px;color:var(--text-light);width:32px;text-align:right">${r.bars[label]}%</span>
</div>
`).join('');

rs.innerHTML = `
<div class="result-type-badge"># ${r.type}</div>
<div class="result-emoji">${r.emoji}</div>
<div class="result-title">${r.title}</div>
<div class="result-subtitle">${r.subtitle}</div>
<div class="result-desc">
${r.desc}
<br><br>
<strong style="color:var(--primary)">⚡ 취약 포인트:</strong> ${r.weakness}
</div>
<div style="margin-bottom:20px;">
<div class="tip-tag">📊 나의 비상대응 역량</div>
${barRows}
</div>
<div class="safety-box">
<h3>🛡️ ${r.safetyTitle}</h3>
${r.safetyItems.map(item => `
<div class="safety-item">
<div class="dot"></div>
<span>${item}</span>
</div>
`).join('')}
<div style="margin-top:14px;padding:10px 14px;background:rgba(255,209,102,0.15);border-radius:10px;font-size:13px;color:var(--accent);">
${r.tipText}
</div>
</div>
<button class="btn-primary" onclick="shareResult('${r.type}', '${r.title}')">📤 결과 공유하기</button>
<button class="btn-restart" onclick="restartQuiz()">🔄 다시 테스트하기</button>
`;

rs.style.animation = 'none';
void rs.offsetWidth;
rs.style.animation = 'slideUp 0.5s ease';

// Animate bars after render
setTimeout(() => {
document.querySelectorAll('.score-bar-fill').forEach(bar => {
bar.style.width = bar.dataset.target + '%';
});
}, 200);

// Scroll to top
window.scrollTo({ top: 0, behavior: 'smooth' });
spawnConfetti();
}

function spawnConfetti() {
const colors = ['#FF6B35','#FFD166','#06D6A0','#2D4A7A','#EF233C','#F9C74F'];
for (let i = 0; i < 30; i++) {
setTimeout(() => {
const el = document.createElement('div');
el.className = 'confetti-piece';
el.style.cssText = `
left: ${Math.random() * 100}vw;
top: -10px;
background: ${colors[Math.floor(Math.random() * colors.length)]};
transform: rotate(${Math.random() * 360}deg);
animation-duration: ${1.5 + Math.random() * 2}s;
animation-delay: ${Math.random() * 0.5}s;
`;
document.body.appendChild(el);
setTimeout(() => el.remove(), 3000);
}, i * 60);
}
}

function shareResult(type, title) {
const text = `🚨 나의 비상대응 유형은 "${type} ${title}"!\nFAB 안전 MBTI 테스트 해보기 👉`;
if (navigator.share) {
navigator.share({ title: '비상대응 MBTI', text });
} else {
navigator.clipboard.writeText(text).then(() => alert('결과가 클립보드에 복사되었습니다! 😊'));
}
}

function restartQuiz() {
currentQ = 0;
scores = { A: 0, B: 0, C: 0, D: 0 };
selectedAnswer = null;
document.getElementById('resultScreen').style.display = 'none';
document.getElementById('progressWrap').classList.remove('visible');
document.getElementById('startScreen').style.display = 'block';
window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
